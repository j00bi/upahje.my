name: Authenticated E2E (protected)

# Live E2E runs only on manual dispatch or a dedicated trigger. It never runs
# on ordinary CI, and it requires test-project secrets (never production).
on:
  workflow_dispatch:
  pull_request:
    branches: [integration/current-verified, main]
    types: [labeled]

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.E2E_NEXTAUTH_SECRET }}
          NEXTAUTH_URL: http://localhost:3000
          PREVIEW_DATA_ENABLED: 'false'
          PAYMENTS_ENABLED: 'false'
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_EMPLOYER_EMAIL: ${{ secrets.E2E_EMPLOYER_EMAIL }}
          E2E_TALENT_A_EMAIL: ${{ secrets.E2E_TALENT_A_EMAIL }}
          E2E_TALENT_B_EMAIL: ${{ secrets.E2E_TALENT_B_EMAIL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_BASE_URL: http://localhost:3000
        run: |
          npm run build
          nohup npm run start > /tmp/upahje-app.log 2>&1 &
          npx wait-on http://localhost:3000 --timeout 120000

      - name: Run authenticated E2E
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.E2E_NEXTAUTH_SECRET }}
          NEXTAUTH_URL: http://localhost:3000
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_EMPLOYER_EMAIL: ${{ secrets.E2E_EMPLOYER_EMAIL }}
          E2E_TALENT_A_EMAIL: ${{ secrets.E2E_TALENT_A_EMAIL }}
          E2E_TALENT_B_EMAIL: ${{ secrets.E2E_TALENT_B_EMAIL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_BASE_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
