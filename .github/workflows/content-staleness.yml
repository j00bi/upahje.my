name: Content staleness

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'content/articles/**'
      - 'scripts/check-staleness.mjs'

jobs:
  staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-staleness.mjs
