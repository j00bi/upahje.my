name: FAQ boundary

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  faq-boundary:
    runs-on: ubuntu-latest
    env:
      # Build-only placeholders: the fixture build prerenders the auth pages,
      # which construct a Supabase client at import time. No request is made.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:faq-boundary
