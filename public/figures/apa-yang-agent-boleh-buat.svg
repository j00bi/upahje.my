<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="t d">
  <title id="t">Tiga cara menyusun kerja sebelum memilih tool</title>
  <desc id="d">Tiga panel: kerja yang berjalan sendiri seperti menyusun peti masuk; kerja yang disediakan agent untuk diluluskan manusia seperti bayaran balik dan mesej pelanggan; kerja yang bukan untuk agent seperti pertimbangan dan kerja fizikal.</desc>
<text x="40" y="48" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#14160f" font-weight="600">Tiga cara menyusun kerja sebelum memilih tool</text><rect x="40.0" y="80" width="297.3" height="300" rx="12" fill="#e6efe4"/><text x="60.0" y="122" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#14160f" font-weight="600">Berjalan sendiri</text><circle cx="66.0" cy="164" r="4" fill="#1a6b2e"/><text x="80.0" y="170" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#3f423c">Susun peti masuk</text><circle cx="66.0" cy="216" r="4" fill="#1a6b2e"/><text x="80.0" y="222" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#3f423c">Ekstrak medan invois</text><circle cx="66.0" cy="268" r="4" fill="#1a6b2e"/><text x="80.0" y="274" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#3f423c">Salin data mengikut jadual</text><rect x="371.3" y="80" width="297.3" height="300" rx="12" fill="#f7efdc"/><text x="391.3" y="122" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#14160f" font-weight="600">Sediakan, manusia luluskan</text><circle cx="397.3" cy="164" r="4" fill="#14160f"/><text x="411.3" y="170" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#3f423c">Bayaran balik</text><circle cx="397.3" cy="216" r="4" fill="#14160f"/><text x="411.3" y="222" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#3f423c">Mesej kepada pelanggan</text><circle cx="397.3" cy="268" r="4" fill="#14160f"/><text x="411.3" y="274" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#3f423c">Penyerahan e-Invoice</text><rect x="702.7" y="80" width="297.3" height="300" rx="12" fill="#efece4"/><text x="722.7" y="122" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#14160f" font-weight="600">Bukan kerja agent</text><circle cx="728.7" cy="164" r="4" fill="#14160f"/><text x="742.7" y="170" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#3f423c">Pertimbangan</text><circle cx="728.7" cy="216" r="4" fill="#14160f"/><text x="742.7" y="222" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#3f423c">Kerja fizikal</text><circle cx="728.7" cy="268" r="4" fill="#14160f"/><text x="742.7" y="274" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#3f423c">Pengetahuan yang tiada</text></svg>
