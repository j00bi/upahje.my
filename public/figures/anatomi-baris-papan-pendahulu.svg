  <title id="t">Satu baris papan pendahulu ialah empat medan, bukan satu angka</title>
  <desc id="d">Baris lima lajur: model DeepSeek V4.1 Flash 1017 pada max; agent Claude Code; tetapan Terminal-bench 4.1 jadual lalai; skor 38.5 peratus tambah tolak 3.8; kos 8.2 bilion token. Nota menyatakan CommandCode dan OpenCode tidak muncul dalam lajur agent.</desc>
