<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="320" viewBox="0 0 1040 320" role="img" aria-labelledby="t d">
  <title id="t">A leaderboard row is four fields, not one number</title>
  <desc id="d">A five-column row: model DeepSeek V4.1 Flash 1017 at max; agent Claude Code; settings Terminal-bench 4.1 default table; score 38.5 percent plus or minus 3.8; cost 8.2 billion tokens. The note says neither CommandCode nor OpenCode appears in the agent column.</desc>
<text x="40" y="52" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#14160f">A leaderboard row is four fields, not one number</text><rect x="24" y="80" width="992" height="128" rx="10" fill="#f3f1ea"/><text x="40" y="112" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#6b6f66" font-weight="600">MODEL</text><text x="300" y="112" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#6b6f66" font-weight="600">AGENT</text><text x="470" y="112" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#6b6f66" font-weight="600">SETTINGS</text><text x="720" y="112" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#6b6f66" font-weight="600">SCORE</text><text x="860" y="112" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#6b6f66" font-weight="600">COST</text><text x="40" y="146" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#14160f">DeepSeek V4.1 Flash</text><text x="40" y="174" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#3f423c">1017 (max)</text><text x="300" y="146" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#14160f">Claude Code</text><text x="470" y="146" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#14160f">Terminal-bench 4.1</text><text x="470" y="174" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#3f423c">default table</text><text x="720" y="146" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#14160f">38.5%</text><text x="720" y="174" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#3f423c">± 3.8</text><text x="860" y="146" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#14160f">8.2B tokens</text><text x="40" y="248" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#3f423c">Read the agent column first: it decides whose number the score is.</text><text x="40" y="282" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#6b6f66">Neither CommandCode nor OpenCode appears in the agent column.</text></svg>
