<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="410" viewBox="0 0 1040 410" role="img" aria-labelledby="t d">
  <title id="t">The tool does the left half. The clock decides the right half.</title>
  <desc id="d">A left-to-right pipeline: build the document, check the TIN, pass eight validators, submit to MyInvois. Below it, two outcomes: within 72 hours a buyer may reject or a seller cancel and reissue; after 72 hours cancellation is closed and a correction needs a credit, debit or refund note.</desc>
<text x="40" y="52" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#14160f" font-weight="600">The tool does the left half. The clock decides the right half.</text><text x="40" y="100" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#6b6f66">Every submission, done by the machine</text><rect x="40.0" y="118" width="220.5" height="72" rx="10" fill="#e6efe4"/><text x="150.2" y="148" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#14160f">Build from</text><text x="150.2" y="172" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#14160f">your records</text><path d="M 266.5 154 L 279.5 154" stroke="#1a6b2e" stroke-width="2"/><path d="M 279.5 154 l -6 -4 l 0 8 z" fill="#1a6b2e"/><rect x="286.5" y="118" width="220.5" height="72" rx="10" fill="#e6efe4"/><text x="396.8" y="160" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#14160f">TIN check</text><path d="M 513.0 154 L 526.0 154" stroke="#1a6b2e" stroke-width="2"/><path d="M 526.0 154 l -6 -4 l 0 8 z" fill="#1a6b2e"/><rect x="533.0" y="118" width="220.5" height="72" rx="10" fill="#e6efe4"/><text x="643.2" y="160" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#14160f">8 validators</text><path d="M 759.5 154 L 772.5 154" stroke="#1a6b2e" stroke-width="2"/><path d="M 772.5 154 l -6 -4 l 0 8 z" fill="#1a6b2e"/><rect x="779.5" y="118" width="220.5" height="72" rx="10" fill="#e6efe4"/><text x="889.8" y="148" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#14160f">Submit to</text><text x="889.8" y="172" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#14160f">MyInvois</text><line x1="40" y1="222" x2="1000" y2="222" stroke="#cfccc3" stroke-width="1"/><text x="40" y="256" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#6b6f66">Depends on the clock, and on a person</text><rect x="40.0" y="274" width="465.0" height="116" rx="10" fill="#f7efdc"/><text x="58.0" y="306" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#14160f" font-weight="600">Within 72 hours</text><text x="58.0" y="336" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#3f423c">buyer may reject</text><text x="58.0" y="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#3f423c">seller may cancel</text><text x="58.0" y="384" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#3f423c">then reissue</text><rect x="535.0" y="274" width="465.0" height="116" rx="10" fill="#f7efdc"/><text x="553.0" y="306" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#14160f" font-weight="600">After 72 hours</text><text x="553.0" y="336" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#3f423c">no cancellation</text><text x="553.0" y="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#3f423c">credit, debit</text><text x="553.0" y="384" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#3f423c">or refund note</text></svg>
