<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="410" viewBox="0 0 1040 410" role="img" aria-labelledby="t d">
  <title id="t">Tool mengerjakan separuh kiri. Jam menentukan separuh kanan.</title>
  <desc id="d">Aliran dari kiri ke kanan: bina dokumen, semak TIN, lulus lapan pengesah, hantar ke MyInvois. Di bawahnya dua hasil: dalam 72 jam pembeli boleh menolak atau penjual membatalkan dan mengeluarkan semula; selepas 72 jam pembatalan ditutup dan pembetulan memerlukan nota kredit, debit atau bayaran balik.</desc>
<text x="40" y="52" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#14160f" font-weight="600">Tool mengerjakan separuh kiri. Jam menentukan separuh kanan.</text><text x="40" y="100" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#6b6f66">Setiap penyerahan, dilakukan mesin</text><rect x="40.0" y="118" width="220.5" height="72" rx="10" fill="#e6efe4"/><text x="150.2" y="148" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#14160f">Bina daripada</text><text x="150.2" y="172" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#14160f">rekod</text><path d="M 266.5 154 L 279.5 154" stroke="#1a6b2e" stroke-width="2"/><path d="M 279.5 154 l -6 -4 l 0 8 z" fill="#1a6b2e"/><rect x="286.5" y="118" width="220.5" height="72" rx="10" fill="#e6efe4"/><text x="396.8" y="160" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#14160f">Semakan TIN</text><path d="M 513.0 154 L 526.0 154" stroke="#1a6b2e" stroke-width="2"/><path d="M 526.0 154 l -6 -4 l 0 8 z" fill="#1a6b2e"/><rect x="533.0" y="118" width="220.5" height="72" rx="10" fill="#e6efe4"/><text x="643.2" y="160" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#14160f">8 pengesah</text><path d="M 759.5 154 L 772.5 154" stroke="#1a6b2e" stroke-width="2"/><path d="M 772.5 154 l -6 -4 l 0 8 z" fill="#1a6b2e"/><rect x="779.5" y="118" width="220.5" height="72" rx="10" fill="#e6efe4"/><text x="889.8" y="148" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#14160f">Hantar ke</text><text x="889.8" y="172" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#14160f">MyInvois</text><line x1="40" y1="222" x2="1000" y2="222" stroke="#cfccc3" stroke-width="1"/><text x="40" y="256" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#6b6f66">Bergantung pada jam, dan pada manusia</text><rect x="40.0" y="274" width="465.0" height="116" rx="10" fill="#f7efdc"/><text x="58.0" y="306" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#14160f" font-weight="600">Dalam 72 jam</text><text x="58.0" y="336" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#3f423c">pembeli boleh tolak</text><text x="58.0" y="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#3f423c">penjual boleh batalkan</text><text x="58.0" y="384" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#3f423c">kemudian keluarkan semula</text><rect x="535.0" y="274" width="465.0" height="116" rx="10" fill="#f7efdc"/><text x="553.0" y="306" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#14160f" font-weight="600">Selepas 72 jam</text><text x="553.0" y="336" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#3f423c">tiada pembatalan</text><text x="553.0" y="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#3f423c">nota kredit, debit</text><text x="553.0" y="384" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#3f423c">atau bayaran balik</text></svg>
