<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="320" viewBox="0 0 1040 320" role="img" aria-labelledby="t d">
  <title id="t">How an order reaches a courier through an API</title>
  <desc id="d">Your store sends an order to the API, the API passes the order to the courier, and the courier's delivery status comes back the same way.</desc>

  <rect width="1040" height="320" fill="#fbfaf7"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <!-- boxes -->
    <g fill="#fdfcf9" stroke="#14160f" stroke-opacity="0.22">
      <rect x="60" y="112" width="240" height="96" rx="10"/>
      <rect x="400" y="112" width="240" height="96" rx="10" stroke="#1a6b2e" stroke-width="1.5" stroke-opacity="1"/>
      <rect x="740" y="112" width="240" height="96" rx="10"/>
    </g>

    <!-- labels -->
    <g fill="#14160f" font-size="17" font-weight="600">
      <text x="180" y="152" text-anchor="middle">Your store</text>
      <text x="520" y="152" text-anchor="middle">API</text>
      <text x="860" y="152" text-anchor="middle">Courier</text>
    </g>
    <g fill="#3f423c" font-size="14">
      <text x="180" y="178" text-anchor="middle">takes an order</text>
      <text x="520" y="178" text-anchor="middle">agreed way to exchange data</text>
      <text x="860" y="178" text-anchor="middle">delivers it</text>
    </g>

    <!-- forward arrows -->
    <g stroke="#3f423c" stroke-width="1.6" fill="none">
      <path d="M 300 160 L 392 160" marker-end="url(#a)"/>
      <path d="M 640 160 L 732 160" marker-end="url(#a)"/>
    </g>
    <g fill="#3f423c" font-size="14">
      <text x="346" y="146" text-anchor="middle">order</text>
      <text x="686" y="146" text-anchor="middle">order</text>
    </g>

    <!-- return path -->
    <g stroke="#1a6b2e" stroke-width="1.6" fill="none" stroke-dasharray="5 5">
      <path d="M 860 208 L 860 252 L 180 252 L 180 214" marker-end="url(#b)"/>
    </g>
    <g fill="#1a6b2e" font-size="14">
      <text x="520" y="274" text-anchor="middle">delivery status, back the same way</text>
    </g>
  </g>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f423c"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a6b2e"/>
    </marker>
  </defs>
</svg>
