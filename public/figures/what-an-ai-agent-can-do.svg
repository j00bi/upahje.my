<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="t d">
  <title id="t">Three ways to sort the work before you choose a tool</title>
  <desc id="d">Three panels: work that runs unattended such as sorting an inbox; work the agent prepares for a human to approve such as refunds and customer messages; work that is not for an agent such as judgement calls and physical tasks.</desc>
<text x="40" y="48" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#14160f" font-weight="600">Three ways to sort the work before you choose a tool</text><rect x="40.0" y="80" width="297.3" height="300" rx="12" fill="#e6efe4"/><text x="60.0" y="122" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#14160f" font-weight="600">Runs on its own</text><circle cx="66.0" cy="164" r="4" fill="#1a6b2e"/><text x="80.0" y="170" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#3f423c">Sort an inbox</text><circle cx="66.0" cy="216" r="4" fill="#1a6b2e"/><text x="80.0" y="222" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#3f423c">Extract invoice fields</text><circle cx="66.0" cy="268" r="4" fill="#1a6b2e"/><text x="80.0" y="274" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#3f423c">Copy data on a schedule</text><rect x="371.3" y="80" width="297.3" height="300" rx="12" fill="#f7efdc"/><text x="391.3" y="122" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#14160f" font-weight="600">Prepare, a human approves</text><circle cx="397.3" cy="164" r="4" fill="#14160f"/><text x="411.3" y="170" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#3f423c">Refunds and payments</text><circle cx="397.3" cy="216" r="4" fill="#14160f"/><text x="411.3" y="222" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#3f423c">Messages to customers</text><circle cx="397.3" cy="268" r="4" fill="#14160f"/><text x="411.3" y="274" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#3f423c">e-Invoice submissions</text><rect x="702.7" y="80" width="297.3" height="300" rx="12" fill="#efece4"/><text x="722.7" y="122" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#14160f" font-weight="600">Not agent work</text><circle cx="728.7" cy="164" r="4" fill="#14160f"/><text x="742.7" y="170" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#3f423c">Judgement calls</text><circle cx="728.7" cy="216" r="4" fill="#14160f"/><text x="742.7" y="222" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#3f423c">Anything physical</text><circle cx="728.7" cy="268" r="4" fill="#14160f"/><text x="742.7" y="274" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#3f423c">Knowledge it lacks</text></svg>
